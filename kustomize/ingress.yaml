apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: max-body-size
spec:
  buffering:
    maxRequestBodyBytes: 10485760 # 10m
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: enable-cors
spec:
  headers:
    accessControlAllowOriginList:
      - "https://hudapobuda.djnd.si"
      - "https://hudapobuda.danesjenovdan.si"
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - "*"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hudapobuda
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: hudapobuda-max-body-size@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hudapobuda.djnd.si
        - hudapobuda.danesjenovdan.si
      secretName: hudapobuda-tls
  rules:
    - host: hudapobuda.djnd.si
      http: &http_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hudapobuda
                port:
                  number: 8000
    - host: hudapobuda.danesjenovdan.si
      http: *http_paths
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hudapobuda-nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: hudapobuda-enable-cors@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - files.hudapobuda.djnd.si
      secretName: hudapobuda-nginx-tls
  rules:
    - host: files.hudapobuda.djnd.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hudapobuda-nginx
                port:
                  number: 80
